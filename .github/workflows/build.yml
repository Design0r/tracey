name: Build

# pull requests are covered by check.yml
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags for this action
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format github
      - run: uv run ruff format --check

  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: macos-arm64
            os: macos-latest # Apple silicon
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags for this action
        with:
          enable-cache: true
      - run: uv sync --locked # the dev group brings PyInstaller
      - run: uv run --no-sync build.py

      # build.py writes dist/Tracey.exe on Windows and dist/Tracey.app on macOS
      - name: Package
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            mv dist/Tracey.exe "dist/Tracey-${{ matrix.target }}.exe"
          else
            ditto -c -k --keepParent dist/Tracey.app "dist/Tracey-${{ matrix.target }}.zip"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Tracey-${{ matrix.target }}
          path: dist/Tracey-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
