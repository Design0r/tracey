[project]
name = "tracey"
version = "0.1.7"
description = "Batch image export with reusable processing profiles"
authors = [{ name = "alex", email = "alex.mors@theapic.de" }]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "potracer>=0.0.4",
    "pyside6>=6.12.0",
    "pyvips[binary]>=3.2.0",
]

[project.scripts]
tracey = "tracey.app:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pillow>=13.0.0", "pyinstaller>=6.22.3", "ruff>=0.17.3"]
